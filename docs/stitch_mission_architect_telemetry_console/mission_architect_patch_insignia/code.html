<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <radialGradient id="patchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DA5F5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#9D74FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DA5F5"/>
      <stop offset="50%" stop-color="#9D74FF"/>
      <stop offset="100%" stop-color="#E0453D"/>
    </linearGradient>
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FA0C4"/>
      <stop offset="50%" stop-color="#2A3350"/>
      <stop offset="100%" stop-color="#131A30"/>
    </linearGradient>
    <linearGradient id="chevronGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B22822"/>
      <stop offset="50%" stop-color="#E0453D"/>
      <stop offset="100%" stop-color="#FFA49E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="120" cy="120" r="110" fill="url(#patchGlow)"/>

  <!-- Tactical Outer Hex/Ring border -->
  <circle cx="120" cy="120" r="108" stroke="#2A3350" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="120" cy="120" r="102" stroke="url(#metalRing)" stroke-width="2"/>
  <circle cx="120" cy="120" r="95" stroke="#3DA5F5" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Compass / Coordinate Ticks -->
  <line x1="120" y1="10" x2="120" y2="24" stroke="#8FA0C4" stroke-width="1.5"/>
  <line x1="120" y1="216" x2="120" y2="230" stroke="#8FA0C4" stroke-width="1.5"/>
  <line x1="10" y1="120" x2="24" y2="120" stroke="#8FA0C4" stroke-width="1.5"/>
  <line x1="216" y1="120" x2="230" y2="120" stroke="#8FA0C4" stroke-width="1.5"/>

  <!-- Celestial Arc / Planetary Limb in Patch -->
  <path d="M 40,165 A 110,75 0 0,0 200,165" stroke="#2A3350" stroke-width="1" stroke-dasharray="2 4"/>
  
  <!-- Elliptical Orbital Flight Trajectory -->
  <ellipse cx="120" cy="120" rx="78" ry="42" stroke="url(#orbitGradient)" stroke-width="2.5" transform="rotate(-28 120 120)" filter="url(#glow)"/>
  
  <!-- Orbital Nodes & Celestial points -->
  <circle cx="62" cy="85" r="2.5" fill="#3DA5F5" filter="url(#glow)"/>
  <circle cx="180" cy="150" r="2.5" fill="#9D74FF"/>
  <circle cx="120" cy="120" r="4" fill="#E6ECF8" stroke="#3DA5F5" stroke-width="1.5"/>

  <!-- Red Vector Thrust Chevron (NASA/Aeronautics Inspired) -->
  <path d="M 120,42 L 158,154 L 120,132 L 82,154 Z" fill="url(#chevronGrad)" filter="url(#glow)"/>
  <path d="M 120,42 L 120,132 L 82,154 Z" fill="#B22822" opacity="0.35"/>

  <!-- Micro-Probe Satellite Silhouette with Solar Panels -->
  <!-- Main Bus Core -->
  <rect x="115" y="112" width="10" height="16" rx="1.5" fill="#E6ECF8" stroke="#0B1020" stroke-width="1"/>
  <!-- Dish / High Gain Antenna -->
  <path d="M 112,108 A 8,8 0 0,1 128,108" stroke="#3DA5F5" stroke-width="1.5" fill="none"/>
  <line x1="120" y1="108" x2="120" y2="112" stroke="#3DA5F5" stroke-width="1"/>
  <circle cx="120" cy="105" r="1.5" fill="#E0453D"/>

  <!-- Left Solar Array Wing -->
  <rect x="86" y="115" width="25" height="10" rx="1" fill="#131A30" stroke="#3DA5F5" stroke-width="1"/>
  <line x1="94" y1="115" x2="94" y2="125" stroke="#3DA5F5" stroke-width="0.75"/>
  <line x1="102" y1="115" x2="102" y2="125" stroke="#3DA5F5" stroke-width="0.75"/>
  <line x1="111" y1="120" x2="115" y2="120" stroke="#E6ECF8" stroke-width="1.5"/>

  <!-- Right Solar Array Wing -->
  <rect x="129" y="115" width="25" height="10" rx="1" fill="#131A30" stroke="#3DA5F5" stroke-width="1"/>
  <line x1="137" y1="115" x2="137" y2="125" stroke="#3DA5F5" stroke-width="0.75"/>
  <line x1="145" y1="115" x2="145" y2="125" stroke="#3DA5F5" stroke-width="0.75"/>
  <line x1="125" y1="120" x2="129" y2="120" stroke="#E6ECF8" stroke-width="1.5"/>

  <!-- Stars & Constellation Points inside Patch -->
  <circle cx="75" cy="55" r="1.2" fill="#E6ECF8"/>
  <circle cx="168" cy="62" r="1.5" fill="#E6ECF8"/>
  <circle cx="178" cy="98" r="1.2" fill="#8FA0C4"/>
  <circle cx="58" cy="138" r="1" fill="#8FA0C4"/>
</svg>

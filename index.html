<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASA Mission Architect — Deep Space Mission Design & Telemetry Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html, body { margin: 0; padding: 0; }
      }
      /* Custom sleek aerospace telemetry scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #071b38;
      }
      ::-webkit-scrollbar-thumb {
        background: #243553;
        border-radius: 4px;
        border: 1px solid #3f4851;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3da5f5;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #243553 #071b38;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-high": "#182a48",
              "primary-fixed-dim": "#98cbff",
              "on-tertiary-fixed-variant": "#5422b2",

              "outline-variant": "#3f4851",
              "error-container": "#93000a",
              "on-tertiary": "#3c0091",
              "on-surface": "#d7e2ff",
              "on-secondary-container": "#abb5cb",
              "surface-bright": "#283958",
              "surface-tint": "#98cbff",
              "on-background": "#d7e2ff",
              "outline": "#89919c",
              "surface-container-highest": "#243553",
              "tertiary-fixed": "#e9ddff",
              "on-primary": "#003354",
              "on-secondary-fixed": "#121c2c",
              "on-tertiary-fixed": "#23005c",
              "primary-container": "#3da5f5",
              "on-primary-container": "#00395d",
              "tertiary-container": "#ac8bff",
              "surface": "#001330",
              "surface-container-low": "#071b38",
              "on-secondary": "#273142",
              "on-primary-fixed-variant": "#004a77",
              "primary-fixed": "#cfe5ff",
              "surface-dim": "#001330",
              "on-secondary-fixed-variant": "#3d475a",
              "inverse-primary": "#00639c",
              "surface-variant": "#243553",
              "inverse-on-surface": "#1f304e",
              "on-error": "#690005",
              "surface-container-lowest": "#000e26",

              "on-error-container": "#ffdad6",
              "error": "#ffb4ab",

              "secondary-fixed-dim": "#bdc7dd",
              "primary": "#98cbff",
              "secondary-fixed": "#d9e3fa",
              "inverse-surface": "#d7e2ff",
              "surface-container": "#0c1f3d",
              "tertiary": "#d0bcff",
              "background": "#001330",

  <body class="bg-surface font-body-default text-on-surface min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
